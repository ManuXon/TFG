version: "3.9"

services:
  backend:
    build:
      context: ./services/backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend.env
    networks:
      - tfg-network

  frontend:
    build:
      context: ./services/frontend
      args:
        ENV: prod
    ports:
      - "8050:8050"
    depends_on:
      - backend
    networks:
      - tfg-network

networks:
  tfg-network:
    driver: bridge

