version: "3.9"

services:
  backend:
    build:
      context: ./services/backend
    # Let Dockerfile ENTRYPOINT+CMD run (no custom command here)
    ports:
      - "8000:8000"
    volumes:
      - ./services/backend:/app
      - - mapai_data:/data
    env_file:
      - ./.env
    environment:
      # Optional: only if you want to actually wait for Redis
      WAIT_FOR_REDIS: "1"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      REDIS_URL: redis://redis:6379/0
      # (you already have this—good)
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS}
      SECRET_KEY: ${SECRET_KEY}
      MAX_LOGIN_ATTEMPTS: ${MAX_LOGIN_ATTEMPTS}
      LOCKOUT_MINUTES: ${LOCKOUT_MINUTES}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - tfg-network

  frontend:
    build:
      context: ./services/frontend
      args:
        ENV: dev
    command: python app.py --debug
    ports:
      - "8050:8050"
    environment:
      - DASH_DEBUG_MODE=True
      - FLASK_ENV=development
    volumes:
      - ./services/frontend:/app
      - ./services/frontend/react-components:/app/react-components
    depends_on:
      - backend
    networks:
      - tfg-network

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - tfg-network
    restart: unless-stopped

networks:
  tfg-network:
    driver: bridge

volumes:
  redis-data:

# RUN "python -m src.scripts.users_tui" inside running container as admin to manage users.