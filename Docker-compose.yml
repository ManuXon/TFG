services:
  frontend:
    build: ./services/frontend
    ports:
      - "8050:8050"
    depends_on:
      - backend
    networks:
      - tfg-network

  backend:
    build: ./services/backend
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    networks:
      - tfg-network

networks:
  tfg-network:
    driver: bridge
